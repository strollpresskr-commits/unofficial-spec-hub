[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strollpress"
version = "0.1.0"
description = "Automated rough-cut pipeline for Jeju documentary archive (Strollpress)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.34.0",
    "google-generativeai>=0.8.0",
    "faster-whisper>=1.0.0",
    "Pillow>=10.0.0",
    "lxml>=5.0.0",
    "watchdog>=4.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.scripts]
strollpress = "strollpress.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["strollpress*"]
