# Strollpress project configuration — Jeju documentary example
# Place this file in your input folder as project.yaml

slug: jeju_spring_2025
title: "봄의 제주 — Jeju in Spring"
theme: >
  Spring rituals and water memory along the Seogwipo coastline.
  Follows three haenyeo divers and one stone-wall craftsman across a single tidal week.
target_length_min: 15
audience: "local Jeju community + international archive viewers, festival circuit"

